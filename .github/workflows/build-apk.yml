name: Build Ceylon Ride APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept Android SDK licenses
        run: |
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Build Cordova Android APK with Location Permissions
        run: |
          npm install -g cordova
          cordova create app com.ceylonride.meter CeylonRide
          rm -rf app/www/*
          cp -r www/* app/www/
          cd app
          cordova platform add android

          MANIFEST="platforms/android/app/src/main/AndroidManifest.xml"
          python3 -c '
          p = "platforms/android/app/src/main/AndroidManifest.xml"
          txt = open(p).read()
          perms = [
              "<uses-permission android:name=\"android.permission.ACCESS_FINE_LOCATION\" />",
              "<uses-permission android:name=\"android.permission.ACCESS_COARSE_LOCATION\" />",
              "<uses-permission android:name=\"android.permission.ACCESS_LOCATION_EXTRA_COMMANDS\" />"
          ]
          for perm in perms:
              if perm not in txt:
                  txt = txt.replace("<manifest ", "<manifest\n    ", 1)
                  txt = txt.replace("</manifest>", f"    {perm}\n</manifest>")
          open(p, "w").write(txt)
          '

          cordova build android

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CeylonRide-APK
          path: app/platforms/android/app/build/outputs/apk/debug/app-debug.apk
