<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CEYLON RIDE - Route & Live GPS Meter</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    body { margin: 0; font-family: Arial, sans-serif; background: #0d1117; color: #f0f6fc; padding: 14px; }
    .card { background: #161b22; border: 1px solid #30363d; border-radius: 12px; padding: 14px; margin-bottom: 14px; }
    .rates { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 12px; }
    .rates label, .field label { font-size: 11px; color: #8b949e; display: block; margin-bottom: 4px; font-weight: 700; }
    input[type="number"], input[type="text"] {
      width: 100%; box-sizing: border-box; background: #0d1117; color: #fff;
      border: 1px solid #30363d; border-radius: 8px; padding: 9px 10px; font-size: 14px;
    }
    .field { margin-bottom: 10px; }
    .input-row { display: flex; gap: 6px; }
    .btn-small {
      background: #21262d; color: #58a6ff; border: 1px solid #30363d; border-radius: 8px;
      padding: 0 10px; font-size: 12px; font-weight: 700; cursor: pointer; white-space: nowrap;
    }
    .btn-route {
      width: 100%; padding: 10px; background: #1f6feb; color: #fff; border: none;
      border-radius: 8px; font-size: 14px; font-weight: 700; cursor: pointer; margin-top: 2px;
    }
    .route-info {
      margin-top: 8px; font-size: 12px; color: #58a6ff; background: #0d1117;
      padding: 8px 10px; border-radius: 8px; border: 1px solid #30363d; display: none;
    }
    .fare-box { text-align: center; padding: 6px 0; }
    .fare { font-size: 34px; font-weight: 700; color: #fff; margin: 4px 0; }
    .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 8px; }
    .stat { background: #0d1117; border-radius: 10px; padding: 10px; text-align: center; }
    .stat .val { font-size: 19px; font-weight: 700; }
    .green { color: #3fb950; }
    .orange { color: #d29922; }
    #map { height: 270px; border-radius: 10px; overflow: hidden; }
    .map-meta { display: flex; justify-content: space-between; font-size: 12px; color: #8b949e; margin-top: 8px; }
    .btn { width: 100%; padding: 14px; border: none; border-radius: 10px; font-size: 15px; font-weight: 700; cursor: pointer; margin-bottom: 10px; }
    .btn-start { background: #238636; color: #fff; }
    .btn-stop { background: #da3633; color: #fff; }
    .btn-sec { background: #21262d; color: #c9d1d9; border: 1px solid #30363d; }
    .status-msg { font-size: 12px; color: #d29922; margin-top: 6px; min-height: 16px; }
  </style>
</head>
<body>

  <!-- Route Planner Card -->
  <div class="card">
    <div class="field">
      <label>START LOCATION (උදා: Matara)</label>
      <div class="input-row">
        <input id="startInput" type="text" placeholder="Enter start town/place..." />
        <button class="btn-small" type="button" onclick="useCurrentAsStart()">My GPS</button>
      </div>
    </div>
    <div class="field">
      <label>END LOCATION (උදා: Galle)</label>
      <input id="endInput" type="text" placeholder="Enter destination town/place..." />
    </div>
    <button class="btn-route" type="button" onclick="planRoute()">SHOW ROUTE ON MAP</button>
    <div class="route-info" id="routeInfo"></div>
  </div>

  <!-- Fare Meter Card -->
  <div class="card">
    <div class="rates">
      <div><label>1ST KM (RS.)</label><input id="baseFare" type="number" value="100" /></div>
      <div><label>NEXT KM (RS.)</label><input id="perKm" type="number" value="80" /></div>
      <div><label>WAIT/MIN (RS.)</label><input id="perWaitMin" type="number" value="4" /></div>
    </div>
    <div class="fare-box">
      <div style="font-size:11px;color:#8b949e;letter-spacing:1px;">CEYLON RIDE • 3-WHEEL • <span id="tripModeLabel">READY</span></div>
      <div class="fare" id="fareDisplay">Rs. 0.00</div>
      <div class="stats">
        <div class="stat"><div style="font-size:11px;color:#8b949e;">TRAVELED</div><div class="val green" id="distDisplay">0.000 km</div></div>
        <div class="stat"><div style="font-size:11px;color:#8b949e;">WAITING TIME</div><div class="val orange" id="waitDisplay">00:00</div></div>
      </div>
    </div>
  </div>

  <!-- Live Map Card -->
  <div class="card">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
      <strong>Live GPS & Route Map</strong>
      <button class="btn-sec" style="padding:5px 10px;border-radius:6px;cursor:pointer;" onclick="centerMap()">My Location</button>
    </div>
    <div id="map"></div>
    <div class="map-meta">
      <span id="locLabel">Waiting for GPS...</span>
      <span id="metersLabel">0 m (0.000 km)</span>
    </div>
    <div class="status-msg" id="statusMsg"></div>
  </div>

  <button class="btn btn-start" id="tripBtn" onclick="toggleTrip()">START TRIP</button>
  <button class="btn btn-sec" onclick="resetMeter()">RESET ALL</button>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    const map = L.map("map").setView([6.0535, 80.2210], 11);
    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      attribution: "&copy; OpenStreetMap"
    }).addTo(map);

    // Live GPS marker (Orange)
    const liveMarker = L.circleMarker([6.0535, 80.2210], {
      radius: 9, color: "#ffffff", weight: 2, fillColor: "#f0883e", fillOpacity: 1
    }).bindPopup("Your Live Location").addTo(map);

    // Planned road route (Blue) & Actual traveled path (Green)
    const plannedRouteLine = L.polyline([], { color: "#1f6feb", weight: 5, opacity: 0.85 }).addTo(map);
    const traveledLine = L.polyline([], { color: "#3fb950", weight: 5 }).addTo(map);

    let startPin = null;
    let endPin = null;
    let startCoords = null;
    let endCoords = null;

    let watchId = null;
    let tripActive = false;
    let lastPos = null;
    let latestGps = null;
    let totalMeters = 0;
    let waitSeconds = 0;
    let currentLatLng = [6.0535, 80.2210];
    let followLiveGps = true;

    function haversineMeters(lat1, lon1, lat2, lon2) {
      const R = 6371000;
      const toRad = d => (d * Math.PI) / 180;
      const dLat = toRad(lat2 - lat1);
      const dLon = toRad(lon2 - lon1);
      const a = Math.sin(dLat / 2) ** 2 +
                Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLon / 2) ** 2;
      return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
    }

    function formatTime(sec) {
      const m = String(Math.floor(sec / 60)).padStart(2, "0");
      const s = String(sec % 60).padStart(2, "0");
      return `${m}:${s}`;
    }

    async function geocodePlace(query) {
      const q = encodeURIComponent(`${query}, Sri Lanka`);
      const url = `https://nominatim.openstreetmap.org/search?format=json&limit=1&q=${q}`;
      const res = await fetch(url);
      if (!res.ok) throw new Error("Location search failed");
      const data = await res.json();
      if (!data || data.length === 0) throw new Error(`"${query}" හමු නොවීය`);
      return {
        lat: parseFloat(data[0].lat),
        lon: parseFloat(data[0].lon),
        name: data[0].display_name.split(",").slice(0, 2).join(", ")
      };
    }

    function useCurrentAsStart() {
      if (!latestGps) {
        document.getElementById("statusMsg").textContent = "GPS signal ලැබෙන තුරු තත්පර කිහිපයක් ඉන්න...";
        return;
      }
      startCoords = { lat: latestGps.latitude, lon: latestGps.longitude, name: "My Current Location" };
      document.getElementById("startInput").value = `${latestGps.latitude.toFixed(5)}, ${latestGps.longitude.toFixed(5)}`;
    }

    async function planRoute() {
      const statusEl = document.getElementById("statusMsg");
      const routeInfoEl = document.getElementById("routeInfo");
      const startText = document.getElementById("startInput").value.trim();
      const endText = document.getElementById("endInput").value.trim();

      if (!startText || !endText) {
        statusEl.textContent = "Start location සහ End location දෙකම ඇතුළත් කරන්න.";
        return;
      }

      statusEl.textContent = "Route එක සොයමින් පවතී...";
      try {
        // Parse coordinates if user clicked "My GPS", otherwise geocode text
        const coordMatch = startText.match(/^(-?\d+\.\d+)\s*,\s*(-?\d+\.\d+)$/);
        if (coordMatch) {
          startCoords = { lat: parseFloat(coordMatch[1]), lon: parseFloat(coordMatch[2]), name: "Start GPS" };
        } else {
          startCoords = await geocodePlace(startText);
        }

        endCoords = await geocodePlace(endText);

        // Fetch road route from OSRM
        const osrmUrl = `https://router.project-osrm.org/route/v1/driving/${startCoords.lon},${startCoords.lat};${endCoords.lon},${endCoords.lat}?overview=full&geometries=geojson`;
        const res = await fetch(osrmUrl);
        const routeData = await res.json();

        if (!routeData.routes || routeData.routes.length === 0) {
          throw new Error("මෙම ස්ථාන දෙක අතර මාර්ගයක් සොයාගත නොහැක.");
        }

        const route = routeData.routes[0];
        const latLngs = route.geometry.coordinates.map(c => [c[1], c[0]]);
        plannedRouteLine.setLatLngs(latLngs);

        if (startPin) map.removeLayer(startPin);
        if (endPin) map.removeLayer(endPin);

        startPin = L.circleMarker([startCoords.lat, startCoords.lon], {
          radius: 8, color: "#fff", weight: 2, fillColor: "#238636", fillOpacity: 1
        }).bindPopup(`Start: ${startCoords.name}`).addTo(map);

        endPin = L.circleMarker([endCoords.lat, endCoords.lon], {
          radius: 8, color: "#fff", weight: 2, fillColor: "#da3633", fillOpacity: 1
        }).bindPopup(`End: ${endCoords.name}`).addTo(map);

        // Fit map to show entire route from Start to End
        followLiveGps = false;
        map.fitBounds(plannedRouteLine.getBounds(), { padding: [30, 30] });

        const distKm = (route.distance / 1000).toFixed(1);
        const mins = Math.round(route.duration / 60);
        const baseFare = parseFloat(document.getElementById("baseFare").value) || 0;
        const perKm = parseFloat(document.getElementById("perKm").value) || 0;
        const estFare = baseFare + (Math.max(0, route.distance / 1000 - 1) * perKm);

        routeInfoEl.style.display = "block";
        routeInfoEl.innerHTML = `<strong>${startCoords.name} → ${endCoords.name}</strong><br/>
          Distance: <b>${distKm} km</b> • Est. Time: <b>${mins} min</b> • Est. Fare: <b>Rs. ${estFare.toFixed(0)}</b>`;
        statusEl.textContent = "Route ready! START TRIP ඔබා ගමන අරඹන්න.";
      } catch (err) {
        statusEl.textContent = `Error: ${err.message}`;
      }
    }

    function updateUI() {
      const km = totalMeters / 1000;
      const baseFare = parseFloat(document.getElementById("baseFare").value) || 0;
      const perKm = parseFloat(document.getElementById("perKm").value) || 0;
      const perWaitMin = parseFloat(document.getElementById("perWaitMin").value) || 0;

      let fare = 0;
      if (tripActive || totalMeters > 0 || waitSeconds > 0) {
        fare += baseFare;
        if (km > 1) fare += (km - 1) * perKm;
        fare += (waitSeconds / 60) * perWaitMin;
      }

      document.getElementById("fareDisplay").textContent = `Rs. ${fare.toFixed(2)}`;
      document.getElementById("distDisplay").textContent = `${km.toFixed(3)} km`;
      document.getElementById("waitDisplay").textContent = formatTime(waitSeconds);
      document.getElementById("metersLabel").textContent = `${Math.round(totalMeters)} m (${km.toFixed(3)} km)`;
    }

    function startTracking() {
      const statusEl = document.getElementById("statusMsg");
      if (!navigator.geolocation) {
        statusEl.textContent = "Browser does not support Geolocation.";
        return;
      }
      if (watchId !== null) return;

      watchId = navigator.geolocation.watchPosition(
        (pos) => {
          const { latitude, longitude, accuracy } = pos.coords;
          latestGps = { latitude, longitude };
          currentLatLng = [latitude, longitude];
          liveMarker.setLatLng(currentLatLng);

          if (followLiveGps) {
            map.setView(currentLatLng, Math.max(map.getZoom(), 14));
          }

          document.getElementById("locLabel").textContent =
            `Live: ${latitude.toFixed(5)}, ${longitude.toFixed(5)} (±${Math.round(accuracy)}m)`;

          if (tripActive) {
            if (lastPos) {
              const d = haversineMeters(lastPos.latitude, lastPos.longitude, latitude, longitude);
              if (d >= 5 && d < 500) {
                totalMeters += d;
                traveledLine.addLatLng(currentLatLng);
                lastPos = { latitude, longitude };
                document.getElementById("tripModeLabel").textContent = "RUNNING";
              } else {
                document.getElementById("tripModeLabel").textContent = "WAITING";
              }
            } else {
              lastPos = { latitude, longitude };
              traveledLine.setLatLngs([currentLatLng]);
              document.getElementById("tripModeLabel").textContent = "WAITING";
            }
          }
          updateUI();
        },
        (err) => {
          statusEl.textContent = `GPS Error: ${err.message} (Check Location permission)`;
        },
        { enableHighAccuracy: true, maximumAge: 1000, timeout: 15000 }
      );
    }

    function toggleTrip() {
      startTracking();
      tripActive = !tripActive;
      const btn = document.getElementById("tripBtn");
      if (tripActive) {
        followLiveGps = true;
        lastPos = null;
        btn.textContent = "END TRIP";
        btn.className = "btn btn-stop";
        document.getElementById("tripModeLabel").textContent = "WAITING";
      } else {
        btn.textContent = "START TRIP";
        btn.className = "btn btn-start";
        document.getElementById("tripModeLabel").textContent = "ENDED";
      }
      updateUI();
    }

    function resetMeter() {
      tripActive = false;
      totalMeters = 0;
      waitSeconds = 0;
      lastPos = null;
      followLiveGps = true;
      traveledLine.setLatLngs([]);
      plannedRouteLine.setLatLngs([]);
      if (startPin) { map.removeLayer(startPin); startPin = null; }
      if (endPin) { map.removeLayer(endPin); endPin = null; }
      document.getElementById("startInput").value = "";
      document.getElementById("endInput").value = "";
      document.getElementById("routeInfo").style.display = "none";
      const btn = document.getElementById("tripBtn");
      btn.textContent = "START TRIP";
      btn.className = "btn btn-start";
      document.getElementById("tripModeLabel").textContent = "READY";
      updateUI();
    }

    function centerMap() {
      followLiveGps = true;
      map.setView(currentLatLng, 16);
    }

    setInterval(() => {
      if (tripActive && document.getElementById("tripModeLabel").textContent === "WAITING") {
        waitSeconds += 1;
        updateUI();
      }
    }, 1000);

    startTracking();
    updateUI();
  </script>
</body>
</html>
